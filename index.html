<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Lab</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        background: linear-gradient(180deg, #bde4ff 0%, #eaf7ff 60%, #eaf7ff 100%);
        font-family: 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
        color: #22314a;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        color: #ff7a3d;
        text-shadow: 2px 2px 0 #fff3;
      }

      main {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
        justify-content: center;
      }

      canvas#stage {
        background: #87ceeb;
        border: 6px solid #ffd166;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }

      #controls {
        min-width: 220px;
        min-height: 200px;
        background: #fff8e7;
        border: 4px dashed #ff7a3d;
        border-radius: 16px;
        padding: 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>🚀 Star Lab</h1>
    <main>
      <canvas id="stage" width="960" height="540"></canvas>
      <div id="controls"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
